name: Spaghet Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Spaghet Android (aarch64)
    runs-on: ubuntu-24.04
    steps:

    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Set up Android NDK & QEMU Environment
      run: |
        sudo apt update && sudo apt install -y qemu-user
        NDKV="27.2.12479018"
        ANDROID_ROOT=/usr/local/lib/android
        ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
        SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
        echo "y" | $SDKMANAGER "ndk;$NDKV"
        ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
        ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        
        # Set NDK Toolchain Environment Variables
        echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV
        echo "TOOLCHAIN_PREFIX=$ANDROID_NDK_BIN/aarch64-linux-android35-" >> $GITHUB_ENV

    - name: Download Network Silently
      run: |
        curl -sSL -o master0002.bin https://github.com/yl25946/vault/raw/main/master0002.bin

    - name: Apply Android C++ Polyfills & Patches
      run: |
        # 1. Inject std::jthread polyfill for Android's incomplete libc++ support
        cat << 'EOF' > src/jthread_polyfill.h
        #pragma once
        #include <thread>
        #include <utility>
        namespace compat {
            class jthread {
                std::thread t;
            public:
                jthread() noexcept = default;
                template <typename Callable, typename... Args>
                explicit jthread(Callable&& f, Args&&... args) : t(std::forward<Callable>(f), std::forward<Args>(args)...) {}
                ~jthread() { if (t.joinable()) t.join(); }
                jthread(jthread&&) noexcept = default;
                jthread& operator=(jthread&&) noexcept = default;
                void join() { t.join(); }
                bool joinable() const noexcept { return t.joinable(); }
                void detach() { t.detach(); }
            };
        }
        EOF
        
        find src -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/std::jthread/compat::jthread/g' {} +
        sed -i '1i #include "jthread_polyfill.h"' src/threads.h

        # 2. Fix C++20 incomplete type constraint by moving ThreadManager implementation into threads.cpp
        # First, remove our previous experimental append from search.h if it exists
        sed -i '/ThreadManager::ThreadManager/d' src/search.h || true
        sed -i '/ThreadManager::~ThreadManager/d' src/search.h || true

        # Now, define the constructor/destructor properly inside threads.cpp where both Searcher and ThreadManager are fully known
        cat << 'EOF' >> src/threads.cpp

        ThreadManager::ThreadManager() : thread_data(options.threads) {}
        ThreadManager::~ThreadManager() = default;
        EOF

    - name: Download SIMDe and Fix Header Collisions
      run: |
        git clone --depth 1 https://github.com/simd-everywhere/simde.git simde-repo
        mv simde-repo/simde src/simde
        
        find src -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's@#include <immintrin.h>@#if defined(__aarch64__) || defined(_M_ARM64)\n#include "simde/x86/avx2.h"\n#else\n#include <immintrin.h>\n#endif@g' {} +

        mv src/time.h src/timeman.h || true
        find src -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/"time.h"/"timeman.h"/g' {} +

    - name: Patch Makefile
      run: |
        sed -i 's/-march=native//g' Makefile
        sed -i 's/ARCH_DETECTED =/ARCH_DETECTED = NONE/g' Makefile

    - name: Compile Spaghet for Android (aarch64)
      run: |
        export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
        
        # Build using NDK Clang.
        make \
          CXX="${{ env.TOOLCHAIN_PREFIX }}clang++" \
          NATIVE="-march=armv8-a" \
          CXXFLAGS="-O3 -flto -fno-exceptions -std=c++20 -DNDEBUG -DUSE_SIMD -DUSE_AVX2 -DEVALFILE=\\\"master0002.bin\\\" -DSIMDE_ENABLE_NATIVE_ALIASES" \
          FLAGS="-pthread" \
          EXE=spaghet-android-arm64

    - name: Bench via QEMU
      run: |
        qemu-aarch64 ./spaghet-android-arm64 bench

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spaghet-android-arm64
        path: ./spaghet-android-arm64

    - name: Create GitHub Prerelease
      if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-build-${{ github.run_number }}
        name: Spaghet Android Build ${{ github.run_number }}
        prerelease: true
        files: ./spaghet-android-arm64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
