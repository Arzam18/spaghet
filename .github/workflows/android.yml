name: Spaghet Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      API_LEVEL: "24"
      NDK_VERSION: "27.2.12479018"
      EVALFILE: "master0002.bin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Use the Android SDK already installed on the GitHub runner.
      # Do NOT use android-actions/setup-android here.
      # ------------------------------------------------------------
      - name: Locate Android SDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          fi

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "Using SDK: $ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

          find "$ANDROID_SDK_ROOT" -maxdepth 2 -type d \
            \( -name "ndk" -o -name "platforms" -o -name "build-tools" \) \
            -print || true

      # ------------------------------------------------------------
      # Find an installed NDK.
      #
      # We prefer 27.2.12479018, but if GitHub's runner already
      # contains another NDK, show it clearly instead of attempting
      # a broken sdkmanager installation.
      # ------------------------------------------------------------
      - name: Select Android NDK
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "Android SDK:"
          echo "$SDK"

          echo
          echo "Installed NDK versions:"
          if [ -d "$SDK/ndk" ]; then
            find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          else
            echo "No NDK directory found."
          fi

          if [ -d "$SDK/ndk/${NDK_VERSION}" ]; then
            SELECTED_NDK="$SDK/ndk/${NDK_VERSION}"
          else
            SELECTED_NDK="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SELECTED_NDK" ] || [ ! -d "$SELECTED_NDK" ]; then
            echo "ERROR: No Android NDK is installed on this runner."
            exit 1
          fi

          echo "Selected NDK:"
          echo "$SELECTED_NDK"

          echo "ANDROID_NDK_HOME=$SELECTED_NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SELECTED_NDK" >> "$GITHUB_ENV"

      - name: Locate ARM64 compiler
        shell: bash
        run: |
          set -eux

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$TOOLCHAIN"

          CXX="$TOOLCHAIN/aarch64-linux-android${API_LEVEL}-clang++"

          if [ ! -x "$CXX" ]; then
            echo "ERROR: ARM64 Android compiler not found:"
            echo "$CXX"

            echo
            echo "Available Android compilers:"
            find "$TOOLCHAIN" \
              -maxdepth 1 \
              -type f \
              -name '*clang++' \
              -print | sort

            exit 1
          fi

          echo "CXX=$CXX" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          "$CXX" --version

      # ------------------------------------------------------------
      # Download the NNUE network.
      # ------------------------------------------------------------
      - name: Download NNUE
        shell: bash
        run: |
          set -eux

          if [ ! -f "${EVALFILE}" ]; then
            wget -O "${EVALFILE}" \
              "https://github.com/yl25946/vault/raw/main/${EVALFILE}"
          fi

          test -s "${EVALFILE}"

          echo "NNUE:"
          ls -lh "${EVALFILE}"

      # ------------------------------------------------------------
      # Add native ARM64 NEON backend.
      # ------------------------------------------------------------
      - name: Add ARM64 NEON SIMD
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/simd.h")
          s = p.read_text()

          if "#elif defined(USE_NEON)" in s:
              print("NEON backend already exists.")
              raise SystemExit(0)

          marker = "#elif defined(USE_AVX2)"

          if marker not in s:
              raise SystemExit(
                  "ERROR: USE_AVX2 block was not found in src/simd.h"
              )

          neon = r'''
          #elif defined(USE_NEON)

          #include <arm_neon.h>

          using vepi16 = int16x8_t;
          using vepi32 = int32x4_t;

          inline vepi16 zero_epi16()
          {
              return vdupq_n_s16(0);
          }

          inline vepi32 zero_epi32()
          {
              return vdupq_n_s32(0);
          }

          inline vepi16 load_epi16(const int16_t* p)
          {
              return vld1q_s16(p);
          }

          inline vepi32 load_epi32(const int32_t* p)
          {
              return vld1q_s32(p);
          }

          inline vepi16 set_epi16(int value)
          {
              return vdupq_n_s16(static_cast<int16_t>(value));
          }

          inline vepi32 set_epi32(int value)
          {
              return vdupq_n_s32(static_cast<int32_t>(value));
          }

          inline vepi16 add_epi16(vepi16 a, vepi16 b)
          {
              return vaddq_s16(a, b);
          }

          inline vepi32 add_epi32(vepi32 a, vepi32 b)
          {
              return vaddq_s32(a, b);
          }

          inline vepi16 multiply_epi16(vepi16 a, vepi16 b)
          {
              return vmulq_s16(a, b);
          }

          inline vepi32 multiply_add_epi16(vepi16 a, vepi16 b)
          {
              const int32x4_t lo =
                  vmull_s16(vget_low_s16(a), vget_low_s16(b));

              const int32x4_t hi =
                  vmull_s16(vget_high_s16(a), vget_high_s16(b));

              return vpaddq_s32(lo, hi);
          }

          inline vepi16 clip(vepi16 v, int limit)
          {
              const vepi16 zero = vdupq_n_s16(0);
              const vepi16 maxv =
                  vdupq_n_s16(static_cast<int16_t>(limit));

              return vminq_s16(vmaxq_s16(v, zero), maxv);
          }

          inline int reduce_add_epi32(vepi32 v)
          {
              int32x2_t pair =
                  vadd_s32(vget_low_s32(v), vget_high_s32(v));

              pair = vpadd_s32(pair, pair);

              return vget_lane_s32(pair, 0);
          }

          '''

          s = s.replace(marker, neon + marker, 1)

          old = """#if defined(USE_SIMD)
          #include <immintrin.h>
          #endif"""

          new = """#if defined(USE_NEON)
          #include <arm_neon.h>
          #elif defined(USE_SIMD)
          #include <immintrin.h>
          #endif"""

          if old not in s:
              raise SystemExit(
                  "ERROR: SIMD include block was not found in src/simd.h"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          echo "NEON backend inserted."

      # ------------------------------------------------------------
      # AArch64 incbin compatibility.
      # ------------------------------------------------------------
      - name: Add AArch64 incbin support
        shell: bash
        run: |
          set -eux

          FILE="src/incbin/incbin.h"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/incbin/incbin.h")
          s = p.read_text()

          if "__aarch64__" in s:
              print("AArch64 already detected by incbin.h.")
              raise SystemExit(0)

          replacements = [
              (
                  "#if defined(__arm__)",
                  "#if defined(__aarch64__) || defined(__arm__)"
              ),
              (
                  "#if defined(__arm)",
                  "#if defined(__aarch64__) || defined(__arm)"
              ),
          ]

          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  p.write_text(s)
                  print("Added AArch64 detection.")
                  raise SystemExit(0)

          print(
              "WARNING: Could not find the expected ARM detection pattern. "
              "Continuing because incbin may already be architecture-neutral."
          )
          PY

      # ------------------------------------------------------------
      # Show source state before compilation.
      # ------------------------------------------------------------
      - name: Show build configuration
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"
          "$ANDROID_NDK_HOME/ndk-build" --version || true

          echo
          echo "========================================"
          echo "COMPILER"
          echo "========================================"
          "$CXX" --version

          echo
          echo "========================================"
          echo "SIMD DEFINITIONS"
          echo "========================================"
          grep -n \
            -E 'USE_NEON|USE_AVX2|USE_AVX512|arm_neon|immintrin' \
            src/simd.h || true

          echo
          echo "========================================"
          echo "SOURCE FILES"
          echo "========================================"
          find src -maxdepth 1 -name '*.cpp' -print | sort

      # ------------------------------------------------------------
      # Compile.
      # ------------------------------------------------------------
      - name: Compile Android ARM64 NEON
        shell: bash
        run: |
          set -eux

          mkdir -p build/android-arm64-neon

          CXXFLAGS="
            -O3
            -flto
            -fno-exceptions
            -std=c++20
            -DNDEBUG
            -DUSE_SIMD
            -DUSE_NEON
            -DEVALFILE=\\\"${EVALFILE}\\\"
            -march=armv8-a
            -fdata-sections
            -ffunction-sections
            -Wall
            -Wextra
            -Wshadow
          "

          echo "========================================"
          echo "BUILDING SPAGHET"
          echo "========================================"

          "$CXX" \
            $CXXFLAGS \
            src/*.cpp \
            -o build/android-arm64-neon/spaghet \
            -pthread

          echo
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          file build/android-arm64-neon/spaghet

          ls -lh build/android-arm64-neon/spaghet

      # ------------------------------------------------------------
      # Verify ELF architecture.
      # ------------------------------------------------------------
      - name: Verify ARM64 ELF
        shell: bash
        run: |
          set -eux

          BINARY="build/android-arm64-neon/spaghet"

          readelf -h "$BINARY"

          readelf -h "$BINARY" | grep "Class:" | grep "ELF64"
          readelf -h "$BINARY" | grep "Machine:" | grep -E "AArch64|ARM"

          test -x "$BINARY"

      # ------------------------------------------------------------
      # Produce exactly ONE output file.
      # ------------------------------------------------------------
      - name: Prepare artifact
        shell: bash
        run: |
          set -eux

          rm -rf artifact
          mkdir -p artifact

          cp \
            build/android-arm64-neon/spaghet \
            artifact/spaghet-android-arm64-neon

          chmod +x artifact/spaghet-android-arm64-neon

          echo "Final artifact:"
          ls -lah artifact

          COUNT="$(find artifact -maxdepth 1 -type f | wc -l)"

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Expected exactly one artifact."
            exit 1
          fi

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: spaghet-android-arm64-neon
          path: artifact/spaghet-android-arm64-neon
          if-no-files-found: error
