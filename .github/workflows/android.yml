name: Spaghet Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      API_LEVEL: "24"
      NDK_VERSION: "29.0.14206865"
      EVALFILE: "master0002.bin"

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Locate Android SDK
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found:"
            echo "$SDK"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK"

      # ============================================================
      # SELECT NDK
      # ============================================================
      - name: Select NDK
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_SDK_ROOT"
          NDK="$SDK/ndk/${NDK_VERSION}"

          echo "Installed NDKs:"
          find "$SDK/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' | sort -V || true

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Expected NDK not installed:"
            echo "$NDK"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo
          echo "Using NDK:"
          echo "$NDK"

      # ============================================================
      # ARM64 CLANG
      # ============================================================
      - name: Locate ARM64 compiler
        shell: bash
        run: |
          set -eux

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN/aarch64-linux-android${API_LEVEL}-clang++"

          if [ ! -x "$CXX" ]; then
            echo "ERROR: ARM64 Android compiler not found:"
            echo "$CXX"

            find "$TOOLCHAIN" \
              -maxdepth 1 \
              -type f \
              -name '*clang++' \
              -print | sort || true

            exit 1
          fi

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          "$CXX" --version

      # ============================================================
      # DOWNLOAD NNUE
      # ============================================================
      - name: Download NNUE
        shell: bash
        run: |
          set -eux

          if [ ! -f "$EVALFILE" ]; then
            wget -O "$EVALFILE" \
              "https://github.com/yl25946/vault/raw/main/$EVALFILE"
          fi

          test -s "$EVALFILE"

          echo "NNUE:"
          ls -lh "$EVALFILE"

      # ============================================================
      # FIX SEARCHER / THREADMANAGER INCLUDE ORDER
      # ============================================================
      - name: Fix Searcher ThreadManager include order
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          search_h = Path("src/search.h")
          search_cpp = Path("src/search.cpp")

          h = search_h.read_text()

          # Remove circular include.
          h = h.replace('#include "threads.h"\n', '')

          # Searcher can refer to ThreadManager through a pointer/reference
          # without requiring the complete class here.
          if 'class ThreadManager;' not in h:
              marker = 'class Searcher\n'

              if marker not in h:
                  raise SystemExit(
                      "ERROR: Could not locate Searcher declaration in search.h"
                  )

              h = h.replace(
                  marker,
                  'class ThreadManager;\n\n' + marker,
                  1
              )

          search_h.write_text(h)

          cpp = search_cpp.read_text()

          if '#include "threads.h"' not in cpp:
              if '#include "search.h"\n' in cpp:
                  cpp = cpp.replace(
                      '#include "search.h"\n',
                      '#include "search.h"\n#include "threads.h"\n',
                      1
                  )
              else:
                  cpp = '#include "threads.h"\n' + cpp

          search_cpp.write_text(cpp)

          print("Searcher/ThreadManager include order fixed.")
          PY

      # ============================================================
      # NATIVE ARM64 NEON SIMD
      # ============================================================
      - name: Add native ARM64 NEON SIMD
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/simd.h")
          s = p.read_text()

          # --------------------------------------------------------
          # Architecture-specific include.
          # --------------------------------------------------------
          old_include = """#if defined(USE_SIMD)
          #include <immintrin.h>
          #endif"""

          new_include = """#if defined(USE_NEON)
          #include <arm_neon.h>
          #elif defined(USE_SIMD)
          #include <immintrin.h>
          #endif"""

          if old_include in s:
              s = s.replace(old_include, new_include, 1)
          elif "#include <arm_neon.h>" not in s:
              raise SystemExit(
                  "ERROR: SIMD include block not found."
              )

          # --------------------------------------------------------
          # NEON backend.
          # --------------------------------------------------------
          if "#if defined(USE_NEON)" not in s:
              marker = "#if defined(USE_AVX512)"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: USE_AVX512 block not found."
                  )

              neon = r'''
          #if defined(USE_NEON)

          using vepi16 = int16x8_t;
          using vepi32 = int32x4_t;

          inline vepi16 zero_epi16()
          {
              return vdupq_n_s16(0);
          }

          inline vepi32 zero_epi32()
          {
              return vdupq_n_s32(0);
          }

          inline vepi16 load_epi16(const int16_t *memory_address)
          {
              return vld1q_s16(memory_address);
          }

          inline vepi32 load_epi32(const int32_t *memory_address)
          {
              return vld1q_s32(memory_address);
          }

          inline vepi16 set_epi16(int num)
          {
              return vdupq_n_s16(static_cast<int16_t>(num));
          }

          inline vepi32 set_epi32(int num)
          {
              return vdupq_n_s32(static_cast<int32_t>(num));
          }

          inline vepi16 add_epi16(vepi16 v1, vepi16 v2)
          {
              return vaddq_s16(v1, v2);
          }

          inline vepi32 add_epi32(vepi32 v1, vepi32 v2)
          {
              return vaddq_s32(v1, v2);
          }

          inline vepi16 multiply_epi16(vepi16 v1, vepi16 v2)
          {
              return vmulq_s16(v1, v2);
          }

          inline vepi32 multiply_add_epi16(vepi16 v1, vepi16 v2)
          {
              const int32x4_t lo =
                  vmull_s16(
                      vget_low_s16(v1),
                      vget_low_s16(v2)
                  );

              const int32x4_t hi =
                  vmull_s16(
                      vget_high_s16(v1),
                      vget_high_s16(v2)
                  );

              return vpaddq_s32(lo, hi);
          }

          inline vepi16 clip(vepi16 vector, int L1Q)
          {
              const vepi16 zero = vdupq_n_s16(0);
              const vepi16 maxv =
                  vdupq_n_s16(static_cast<int16_t>(L1Q));

              return vminq_s16(
                  vmaxq_s16(vector, zero),
                  maxv
              );
          }

          inline int reduce_add_epi32(vepi32 vector)
          {
              int32x2_t sum =
                  vadd_s32(
                      vget_low_s32(vector),
                      vget_high_s32(vector)
                  );

              sum = vpadd_s32(sum, sum);

              return vget_lane_s32(sum, 0);
          }

          #elif defined(USE_AVX512)
          '''

              s = s.replace(
                  marker,
                  neon,
                  1
              )

          p.write_text(s)

          print("Native ARM64 NEON backend installed.")
          PY

          echo
          echo "SIMD configuration:"
          grep -n -E \
            'USE_NEON|USE_AVX512|USE_AVX2|arm_neon|immintrin' \
            src/simd.h || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Compile Android ARM64 NEON
        shell: bash
        run: |
          set -eux

          mkdir -p build/android-arm64-neon

          echo "Compiler:"
          "$CXX" --version

          echo
          echo "Building Spaghet..."

          "$CXX" \
            -O3 \
            -funroll-loops \
            -flto \
            -fno-exceptions \
            -std=c++20 \
            -DNDEBUG \
            -Wall \
            -Wextra \
            -Wshadow \
            -Wdouble-promotion \
            -Wformat=2 \
            -Wnull-dereference \
            -Wold-style-cast \
            -Wundef \
            -pedantic \
            -DUSE_SIMD \
            -DUSE_NEON \
            '-DEVALFILE="master0002.bin"' \
            -march=armv8-a \
            -fdata-sections \
            -ffunction-sections \
            src/*.cpp \
            -pthread \
            -o build/android-arm64-neon/spaghet

          echo
          echo "BUILD SUCCESSFUL"

          ls -lh build/android-arm64-neon/spaghet

      # ============================================================
      # VERIFY ARM64 ELF
      # ============================================================
      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -eux

          BINARY="build/android-arm64-neon/spaghet"

          echo "----- file -----"
          file "$BINARY"

          echo
          echo "----- ELF header -----"
          readelf -h "$BINARY"

          file "$BINARY" | grep -Ei \
            'ARM aarch64|ARM64|AArch64'

          readelf -h "$BINARY" | grep "Class:" | grep "ELF64"

          readelf -h "$BINARY" | grep "Machine:" | grep -Ei \
            'AArch64|ARM'

          test -x "$BINARY"

      # ============================================================
      # VERIFY EMBEDDED NNUE
      # ============================================================
      - name: Verify embedded NNUE
        shell: bash
        run: |
          set -eux

          BINARY="build/android-arm64-neon/spaghet"

          echo "Binary:"
          ls -lh "$BINARY"

          echo
          echo "NNUE-related symbols:"
          readelf -s "$BINARY" | grep -E \
            'gEVALData|gEVALEnd|gEVALSize' || true

      # ============================================================
      # ONE BINARY ONLY
      # ============================================================
      - name: Prepare artifact
        shell: bash
        run: |
          set -eux

          rm -rf artifact
          mkdir -p artifact

          cp \
            build/android-arm64-neon/spaghet \
            artifact/spaghet-android-arm64-neon

          chmod +x artifact/spaghet-android-arm64-neon

          echo "Final artifact:"
          ls -lah artifact

          COUNT="$(find artifact -maxdepth 1 -type f | wc -l)"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one binary."
            exit 1
          fi

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: spaghet-android-arm64-neon
          path: artifact/spaghet-android-arm64-neon
          if-no-files-found: error
