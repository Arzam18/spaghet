name: Spaghet Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/android.yml'
      - 'Makefile'

jobs:
  build:
    name: Build Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      API_LEVEL: '24'
      NDK_VERSION: '29.0.14206865'
      EVALFILE: 'master0002.bin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android NDK
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/$NDK_VERSION"

          test -d "$SDK"
          test -d "$NDK"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK"
          echo "Android NDK: $NDK"

      - name: Select ARM64 Clang
        shell: bash
        run: |
          set -eux

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN/aarch64-linux-android${API_LEVEL}-clang++"

          test -x "$CXX"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          "$CXX" --version

      - name: Download NNUE
        shell: bash
        run: |
          set -eux

          if [ ! -s "$EVALFILE" ]; then
            wget -O "$EVALFILE" \
              "https://github.com/yl25946/vault/raw/main/$EVALFILE"
          fi

          test -s "$EVALFILE"
          ls -lh "$EVALFILE"

      - name: Build Spaghet
        shell: bash
        run: |
          set -eux

          mkdir -p build

          "$CXX" \
            -O3 \
            -funroll-loops \
            -flto \
            -fno-exceptions \
            -fuse-ld=lld \
            -static-libstdc++ \
            -std=c++20 \
            -DNDEBUG \
            -Wall \
            -Wextra \
            -Wshadow \
            -Wdouble-promotion \
            -Wformat=2 \
            -Wnull-dereference \
            -Wold-style-cast \
            -Wundef \
            -pedantic \
            -DUSE_SIMD \
            -DUSE_NEON \
            '-DEVALFILE="master0002.bin"' \
            -march=armv8-a \
            -fdata-sections \
            -ffunction-sections \
            src/*.cpp \
            -pthread \
            -o build/spaghet-android-arm64-neon

          chmod +x build/spaghet-android-arm64-neon

      - name: Verify Android ARM64 binary
        shell: bash
        run: |
          set -eux

          BINARY="build/spaghet-android-arm64-neon"

          file "$BINARY"
          readelf -h "$BINARY"

          file "$BINARY" | grep -Ei 'ARM aarch64|ARM64|AArch64'
          readelf -h "$BINARY" | grep 'Class:' | grep 'ELF64'
          readelf -h "$BINARY" | grep 'Machine:' | grep -Ei 'AArch64|ARM'

          test -x "$BINARY"
          test -s "$BINARY"

      - name: Prepare single-file artifact
        shell: bash
        run: |
          set -eux

          rm -rf artifact
          mkdir -p artifact

          cp build/spaghet-android-arm64-neon \
            artifact/spaghet-android-arm64-neon

          chmod +x artifact/spaghet-android-arm64-neon

          test "$(find artifact -maxdepth 1 -type f | wc -l)" -eq 1
          ls -lh artifact

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: spaghet-android-arm64-neon
          path: artifact/spaghet-android-arm64-neon
          if-no-files-found: error
