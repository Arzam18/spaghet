name: Spaghet Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Spaghet Android (aarch64)
    runs-on: ubuntu-24.04
    steps:

    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Set up Android NDK & QEMU Environment
      run: |
        sudo apt update && sudo apt install -y qemu-user
        NDKV="27.2.12479018"
        ANDROID_ROOT=/usr/local/lib/android
        ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
        SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
        echo "y" | $SDKMANAGER "ndk;$NDKV"
        ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
        ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        
        # Set NDK Toolchain Environment Variables
        echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV
        echo "TOOLCHAIN_PREFIX=$ANDROID_NDK_BIN/aarch64-linux-android35-" >> $GITHUB_ENV

    - name: Download SIMDe for ARM AVX2 Translation
      run: |
        git clone https://github.com/simd-everywhere/simde.git src/simde
        
        # Patch simd.h to use SIMDe when compiling for ARM64
        sed -i 's|#include <immintrin.h>|#if defined(__aarch64__) || defined(_M_ARM64)\n#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "simde/x86/avx2.h"\n#else\n#include <immintrin.h>\n#endif|g' src/simd.h

    - name: Patch Makefile (Fix NDK Cross-Compilation)
      run: |
        # Prevent the Makefile from running -march=native in its property detection shell script
        sed -i 's/-march=native//g' Makefile
        sed -i 's/ARCH_DETECTED =/ARCH_DETECTED = NONE/g' Makefile

    - name: Compile Spaghet for Android (aarch64)
      run: |
        export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
        
        # Build using NDK Clang. 
        # We define USE_SIMD and USE_AVX2 to trigger Spaghet's AVX2 code, which SIMDe translates to NEON.
        make \
          CXX="${{ env.TOOLCHAIN_PREFIX }}clang++" \
          NATIVE="-march=armv8-a+fp+simd" \
          CXXFLAGS="-O3 -flto -fno-exceptions -std=c++20 -DNDEBUG -DUSE_SIMD -DUSE_AVX2 -DEVALFILE=\\\"master0002.bin\\\" -I./src" \
          LDFLAGS="-fuse-ld=lld -static-libstdc++" \
          EXE=spaghet-android-arm64

    - name: Bench via QEMU
      run: |
        qemu-aarch64 ./spaghet-android-arm64 bench

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spaghet-android-arm64
        path: ./spaghet-android-arm64

    - name: Create GitHub Prerelease
      if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-build-${{ github.run_number }}
        name: Spaghet Android Build ${{ github.run_number }}
        prerelease: true
        files: ./spaghet-android-arm64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
