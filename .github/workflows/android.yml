name: Spaghet Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.2.12479018"
      API_LEVEL: "24"
      EVALFILE: "master0002.bin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        shell: bash
        run: |
          set -eux

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${API_LEVEL}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Show compiler
        shell: bash
        run: |
          set -eux

          export TOOLCHAIN="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLCHAIN/aarch64-linux-android${API_LEVEL}-clang++" \
            --version

      # ------------------------------------------------------------
      # Patch Spaghet's SIMD abstraction for native ARM64 NEON.
      #
      # We deliberately do NOT use sse2neon here.
      #
      # The original AVX2 backend works with:
      #   16 x int16
      #   8  x int32
      #
      # ARM64 NEON is 128-bit:
      #   8 x int16
      #   4 x int32
      #
      # nnue.cpp uses sizeof(vepi16), so the smaller chunk size is
      # automatically handled by the existing loop.
      # ------------------------------------------------------------
      - name: Add native ARM64 NEON backend
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/simd.h")
          s = p.read_text()

          if "#elif defined(USE_NEON)" in s:
              print("NEON backend already present; leaving it unchanged.")
              raise SystemExit(0)

          marker = "#elif defined(USE_AVX2)"

          if marker not in s:
              raise SystemExit("ERROR: USE_AVX2 block not found in src/simd.h")

          neon = r'''#elif defined(USE_NEON)

          #include <arm_neon.h>

          // ARM64 NEON is mandatory on AArch64.
          //
          // The x86 AVX2 implementation uses 256-bit vectors:
          //   16 x int16
          //   8  x int32
          //
          // NEON uses 128-bit vectors:
          //   8 x int16
          //   4 x int32
          //
          // nnue.cpp derives its loop chunk size from sizeof(vepi16),
          // so no NNUE loop rewrite is required.

          using vepi16 = int16x8_t;
          using vepi32 = int32x4_t;

          inline vepi16 zero_epi16()
          {
              return vdupq_n_s16(0);
          }

          inline vepi32 zero_epi32()
          {
              return vdupq_n_s32(0);
          }

          inline vepi16 load_epi16(const int16_t *memory_address)
          {
              return vld1q_s16(memory_address);
          }

          inline vepi32 load_epi32(const int32_t *memory_address)
          {
              return vld1q_s32(memory_address);
          }

          // Put num into every 16-bit lane.
          inline vepi16 set_epi16(int num)
          {
              return vdupq_n_s16(static_cast<int16_t>(num));
          }

          // Put num into every 32-bit lane.
          inline vepi32 set_epi32(int num)
          {
              return vdupq_n_s32(static_cast<int32_t>(num));
          }

          inline vepi16 add_epi16(vepi32 v1, vepi32 v2)
          {
              return vaddq_s16(v1, v2);
          }

          inline vepi32 add_epi32(vepi32 v1, vepi32 v2)
          {
              return vaddq_s32(v1, v2);
          }

          // Low 16 bits of each signed 16-bit multiplication,
          // matching _mm256_mullo_epi16 / _mm512_mullo_epi16.
          inline vepi16 multiply_epi16(vepi16 v1, vepi16 v2)
          {
              return vmulq_s16(v1, v2);
          }

          // Equivalent to _mm*_madd_epi16:
          //
          //   result[0] = v1[0]*v2[0] + v1[1]*v2[1]
          //   result[1] = v1[2]*v2[2] + v1[3]*v2[3]
          //   ...
          //
          // NEON has 128-bit vectors, so we multiply the low and high
          // halves separately and then perform pairwise additions.
          inline vepi32 multiply_add_epi16(vepi16 v1, vepi16 v2)
          {
              const int32x4_t lo =
                  vmull_s16(vget_low_s16(v1), vget_low_s16(v2));

              const int32x4_t hi =
                  vmull_s16(vget_high_s16(v1), vget_high_s16(v2));

              return vpaddq_s32(lo, hi);
          }

          inline vepi16 clip(vepi16 vector, int L1Q)
          {
              const vepi16 zero = zero_epi16();
              const vepi16 maxv = set_epi16(L1Q);

              return vminq_s16(vmaxq_s16(vector, zero), maxv);
          }

          inline int reduce_add_epi32(vepi32 vector)
          {
              int32x2_t pair = vadd_s32(
                  vget_low_s32(vector),
                  vget_high_s32(vector)
              );

              pair = vpadd_s32(pair, pair);

              return vget_lane_s32(pair, 0);
          }

          '''

          s = s.replace(marker, neon + marker, 1)

          # USE_SIMD currently only includes immintrin.h.
          # That header must not be included on ARM.
          old = '''#if defined(USE_SIMD)
          #include <immintrin.h>
          #endif'''

          new = '''#if defined(USE_NEON)
          #include <arm_neon.h>
          #elif defined(USE_SIMD)
          #include <immintrin.h>
          #endif'''

          if old not in s:
              raise SystemExit(
                  "ERROR: expected SIMD include block not found in src/simd.h"
              )

          s = s.replace(old, new, 1)

          # The NEON backend is selected before AVX2.
          p.write_text(s)
          PY

          echo "----- patched src/simd.h -----"
          sed -n '1,240p' src/simd.h

      # ------------------------------------------------------------
      # AArch64 incbin compatibility.
      #
      # GNU incbin already works on ARM64, but the source only
      # explicitly recognizes 32-bit ARM. Add __aarch64__ so the
      # ARM alignment path is selected explicitly.
      # ------------------------------------------------------------
      - name: Patch AArch64 incbin support
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/incbin/incbin.h")
          s = p.read_text()

          if "defined(__aarch64__)" in s:
              print("AArch64 incbin support already present.")
              raise SystemExit(0)

          old = '''#if defined(__arm__) || /* GNU C and RealView */ \\
              defined(__arm) ||   /* Diab */               \\
              defined(_ARM)       /* ImageCraft */'''

          new = '''#if defined(__aarch64__) || /* AArch64 / ARM64 */   \\
              defined(__arm__) ||    /* GNU C and RealView */            \\
              defined(__arm) ||      /* Diab */                          \\
              defined(_ARM)          /* ImageCraft */'''

          if old not in s:
              raise SystemExit(
                  "ERROR: expected ARM detection block not found in incbin.h"
              )

          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          grep -n -A6 -B2 "aarch64" src/incbin/incbin.h

      # ------------------------------------------------------------
      # Download the network.
      # ------------------------------------------------------------
      - name: Download NNUE network
        shell: bash
        run: |
          set -eux

          if [ ! -f "${EVALFILE}" ]; then
            wget -O "${EVALFILE}" \
              "https://github.com/yl25946/vault/raw/main/${EVALFILE}"
          fi

          test -s "${EVALFILE}"
          ls -lh "${EVALFILE}"

      # ------------------------------------------------------------
      # Compile directly with Android NDK Clang.
      #
      # Do not use the project's Makefile here because its automatic
      # architecture detection is x86-oriented and would not select
      # an ARM backend.
      # ------------------------------------------------------------
      - name: Build Android ARM64 NEON
        shell: bash
        run: |
          set -eux

          export TOOLCHAIN="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CXX="$TOOLCHAIN/aarch64-linux-android${API_LEVEL}-clang++"

          mkdir -p build/android-arm64-neon

          CXXFLAGS="
            -O3
            -flto
            -fno-exceptions
            -std=c++20
            -DNDEBUG
            -DUSE_SIMD
            -DUSE_NEON
            -DEVALFILE=\\\"${EVALFILE}\\\"
            -march=armv8-a
            -fdata-sections
            -ffunction-sections
            -Wall
            -Wcast-qual
            -Wextra
            -Wshadow
            -Wdouble-promotion
            -Wformat=2
            -Wnull-dereference
            -Wlogical-op
            -Wold-style-cast
            -Wundef
            -pedantic
          "

          echo "Compiler:"
          "$CXX" --version

          echo
          echo "Building sources:"
          find src -maxdepth 1 -name '*.cpp' -print | sort

          "$CXX" $CXXFLAGS \
            -pthread \
            src/*.cpp \
            -o build/android-arm64-neon/spaghet

          file build/android-arm64-neon/spaghet
          ls -lh build/android-arm64-neon/spaghet

      # ------------------------------------------------------------
      # Verify it is actually an ARM64 Android executable.
      # ------------------------------------------------------------
      - name: Verify binary
        shell: bash
        run: |
          set -eux

          BINARY="build/android-arm64-neon/spaghet"

          file "$BINARY"

          readelf -h "$BINARY" | grep -E \
            'Class:|Machine:|Type:'

          readelf -A "$BINARY" || true

          test -x "$BINARY"

      # ------------------------------------------------------------
      # Basic static/strings sanity checks.
      #
      # We cannot execute an Android ARM64 binary on the Ubuntu
      # runner directly, so the real UCI/bench test is left for
      # the Android device.
      # ------------------------------------------------------------
      - name: Binary sanity check
        shell: bash
        run: |
          set -eux

          BINARY="build/android-arm64-neon/spaghet"

          strings "$BINARY" | grep -F "uci" >/dev/null
          strings "$BINARY" | grep -F "Spaghet" >/dev/null || true

          echo "Android ARM64 NEON binary created successfully."

      # ------------------------------------------------------------
      # ONE FILE ONLY.
      # ------------------------------------------------------------
      - name: Prepare artifact
        shell: bash
        run: |
          set -eux

          mkdir -p artifact

          cp build/android-arm64-neon/spaghet \
             artifact/spaghet-android-arm64-neon

          chmod +x artifact/spaghet-android-arm64-neon

          echo "Artifact:"
          ls -lh artifact

          test "$(find artifact -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: spaghet-android-arm64-neon
          path: artifact/spaghet-android-arm64-neon
          if-no-files-found: error
